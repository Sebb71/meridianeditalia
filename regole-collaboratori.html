<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regole per i collaboratori</title>
<!-- noindex fisso: l'ordine degli attributi impedisce al .bat di cambiarlo quando attivi l'indicizzazione -->
<meta content="noindex, nofollow" name="robots">
<meta name="referrer" content="no-referrer">
<style>
  body { margin:0; background:#f4f6f8; color:#1d2733; font:16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 20px 60px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .meta { color:#5c6b7a; font-size:14px; margin:0 0 18px; }
  ol { padding-left:22px; } li { margin-bottom:12px; }
  .azioni { margin:20px 0; }
  button { font:inherit; min-height:44px; padding:0 18px; border:0; background:#0f766e; color:#fff; border-radius:8px; font-weight:650; cursor:pointer; }
  .piccolo { color:#5c6b7a; font-size:14px; }
  @media print { body { background:#fff; } main { padding:0; } .azioni { display:none; } }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1 id="titolo">Regole per i collaboratori</h1>
  <p class="meta" id="meta">Caricamento…</p>
  <p id="intro"></p>
  <ol id="punti"></ol>
  <div class="azioni"><button type="button" id="stampa" hidden>Stampa o salva in PDF</button></div>
  <p class="piccolo">Per domande o segnalazioni: <a href="mailto:meridianeditalia@gmail.com">meridianeditalia@gmail.com</a>. Questa pagina non contiene dati personali.</p>
</main>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  $("stampa").onclick = () => window.print();
  try {
    const c = await (await fetch("data/config-form.json")).json();
    if (!c || !c.endpoint) throw new Error("servizio non disponibile");
    const r = await (await fetch(c.endpoint, { method: "POST", body: JSON.stringify({ azione: "mod_norme" }) })).json();
    if (!r || !r.ok) throw new Error("risposta non valida");
    $("titolo").textContent = r.titolo; $("intro").textContent = r.intro;
    r.punti.forEach(t => { const li = document.createElement("li"); li.textContent = t; $("punti").appendChild(li); });
    $("meta").textContent = "Versione " + r.versione + " · impronta del testo " + String(r.impronta).slice(0, 8);
    document.title = r.titolo + " (versione " + r.versione + ")";
    $("stampa").hidden = false;
  } catch (e) {
    $("meta").textContent = "Non riesco a caricare le regole in questo momento. Riprova tra poco.";
  }
})();
</script>
</body>
</html>
